global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api-health
    metrics_path: /health
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Add postgres_exporter / redis_exporter targets here when enabled:
  # - job_name: postgres
  #   static_configs: [{ targets: ["postgres-exporter:9187"] }]
  # - job_name: redis
  #   static_configs: [{ targets: ["redis-exporter:9121"] }]
