user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Rate limiting at the edge (backend has its own second layer).
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/s;

    upstream api_backend { server api:8000; }
    upstream web_frontend { server web:80; }

    # HTTP -> HTTPS redirect (production)
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 12m;

        # Auth endpoints: tighter limit
        location ~ ^/api/v1/auth/(login|register|forgot-password|google) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_custom;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_custom;
        }

        # WebSocket
        location /api/v1/ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /health {
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_custom;
        }

        # Flutter web app
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
        }
    }
}
