name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habitdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habit" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Unit & API tests
        run: pytest tests -q
        env:
          SECRET_KEY: ci-secret-key
          LOCATION_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DATABASE_URL: postgresql+asyncpg://habit:habit@localhost:5432/habitdb
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
      - name: Alembic migration check
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://habit:habit@localhost:5432/habitdb
          SECRET_KEY: ci-secret-key
          LOCATION_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-lint-test, flutter-test, docker-build]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/habit-tracker
            git pull --ff-only
            docker compose pull
            docker compose build
            docker compose up -d --remove-orphans
            docker compose run --rm migrate
